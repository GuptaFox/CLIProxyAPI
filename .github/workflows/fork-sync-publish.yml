# Fork only: keeps GuptaFox/CLIProxyAPI current with upstream and publishes the
# image the TrueNAS stack runs (ghcr.io/guptafox/cliproxyapi).
#
# Nightly at 08:15 UTC (02:15 CST / 03:15 CDT), before the NAS's Watchtower
# check at 04:00 Central:
#   1. Merge router-for-me/CLIProxyAPI main into this fork's main.
#   2. Build, and run the tests for the routing and config packages the fork
#      changes. Upstream's own CI only builds, and some of its other tests
#      (Antigravity executor and translator) fail on upstream main, so a full
#      `go test ./...` would block every night.
#   3. Only if they pass, push the merge and publish the image as `latest`,
#      built like upstream's image (model catalog refreshed first).
# A merge conflict or a failing test stops the run before anything is pushed,
# so the NAS keeps the last good image, and an issue is opened (or commented on).
#
# Pushes to main (a merged fork PR) and manual runs rebuild the image too.
#
# Pushing a merge that changes files under .github/workflows needs a token with
# the "workflows" permission, which GITHUB_TOKEN never has. Store a fine-grained
# token for this repository (Contents: read and write, Workflows: read and
# write) as the secret FORK_SYNC_TOKEN. Without it the run still works until an
# upstream merge touches a workflow file; then it fails with an issue.
name: Fork sync and publish

on:
  schedule:
    - cron: "15 8 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: fork-sync-publish
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/router-for-me/CLIProxyAPI.git
  IMAGE: ghcr.io/guptafox/cliproxyapi

jobs:
  sync-test-publish:
    if: github.repository == 'GuptaFox/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Merge upstream main
        id: merge
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit upstream/main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::error::Merging upstream main conflicts with the fork's changes."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o /tmp/cli-proxy-api ./cmd/server

      - name: Test
        run: go test ./sdk/... ./internal/config/...

      - name: Push merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # Not committed: upstream's image build refreshes the catalog the same way.
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Image version
        id: version
        run: |
          git fetch --tags --force "$UPSTREAM" 'refs/tags/v*:refs/tags/v*' || true
          base="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
          echo "version=${base}-guptafox.$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fork sync or image publish failed"
          body="The [${GITHUB_EVENT_NAME} run](${RUN_URL}) failed, so main and the NAS image were left as they were. Check the run log: a merge conflict with upstream, a failing test, or (when the push step failed) an upstream change to .github/workflows that needs the FORK_SYNC_TOKEN secret."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
